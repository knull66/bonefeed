# Static landing only — ignore Swift Package.swift at repo root.
# Checkout uses Stripe Payment Links (no site-level npm / no secret keys in git).
[build]
  base = "Web"
  publish = "."
  command = "true"

  # Accidental Netlify env var "Name" (often value = STRIPE_SECRET_KEY string) trips
  # secrets scan against create-checkout.js comments/code. Omit until deleted in UI.
  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "Name"

# Optional create-checkout function: deps live in netlify/functions/package.json
# and are bundled with the function — never published as static files.
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
